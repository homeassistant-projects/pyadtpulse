[build-system]
requires = ["uv_build>=0.8.0,<0.14"]
build-backend = "uv_build"

[project]
name = "pyadtpulse"
version = "1.3.0"
description = "Python interface for ADT Pulse security systems"
authors = [{ name = "Ryan Snodgrass" }]
maintainers = [{ name = "Elliot Worth", email = "elliotworth@protonmail.com" }]
readme = "README.md"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.12.14",
    "aiohttp-fast-zlib[zlib-ng]>=0.3.0",
    "lxml>=6.0.0",
    "typeguard>=4.4.4",
    # imported directly (URL handling); same floor aiohttp>=3.12.14 requires
    "yarl>=1.17.0",
]


[dependency-groups]
bandit = ["bandit[sarif,toml]>=1.8.6"]
dev = [
    # Exact pin: the release job in pypi-publish.yml runs this same version.
    "commitizen==4.19.4",
    "deptry>=0.25.1",
    "pre-commit>=4.2.0",
    # Exact pin: ruff-action in the Validate workflow installs this version.
    # Keep it in sync with the ruff-pre-commit rev in .pre-commit-config.yaml.
    "ruff==0.17.6",
]
testing = [
    # aioresponses 0.7.9 cannot build aiohttp 3.14 responses (missing
    # stream_writer): https://github.com/pnuckowski/aioresponses/issues/289
    # Test-only cap; drop it once aioresponses supports 3.14.
    "aiohttp<3.14",
    "aioresponses>=0.7.8",
    "freezegun>=1.5.2",
    # pytest-isolate 0.0.17 fails on pytest 9.2 (_pytest.warnings.apply_warning_filters
    # moved). 0.0.18 fixes it (233 tests pass on pytest 9.2.0); drop this cap and
    # require pytest-isolate>=0.0.18 once 0.0.18 is older than the exclude-newer
    # cooldown below (released 2026-11-22).
    "pytest>=8.4.1,<9.2",
    "pytest-asyncio>=1.0.0",
    "pytest-isolate>=0.0.12",
    "pytest-mock>=3.14.1",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

exclude = ["example-client.py"]

[tool.uv]
# Relative exclude-newer durations need uv 0.9.17+.
required-version = ">=0.9.17"
# Cooldown: ignore releases younger than 2 days when resolving. uv.lock is not
# committed (this is a library), so this is what keeps CI off brand-new releases.
exclude-newer = "2 days"
default-groups = ["dev", "testing"]

[tool.commitizen]
# Releases are cut automatically from conventional commits on master: see
# .github/workflows/pypi-publish.yml. feat -> minor, fix/perf/refactor -> patch,
# "BREAKING CHANGE" -> major; docs/ci/build/chore/test don't release.
name = "cz_conventional_commits"
version_provider = "pep621"    # [project].version is the only version source
tag_format = "$version"         # existing tags are 1.2.14 etc., no "v"
update_changelog_on_bump = true
changelog_incremental = true    # keep the hand-written history below new entries
bump_message = "bump: version $current_version → $new_version"

[tool.uv.build-backend]
module-name = "pyadtpulse"
module-root = ""


[tool.ruff]
line-length = 88                # Matches black
show-fixes = true
target-version = "py310"
exclude = ["example-client.py"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
line-ending = "auto"

[tool.ruff.lint]
ignore = [
    "D107",    #missing-docstring-in-init
    "PLR2004", #Magic Values
    "D203",    #no-blank-line-before-class
    "D212",    #multi-line-summary-first-line
]
select = [
    "I",   # isort
    "F",   # pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "D",   # pydocstyle
    "PL",  # pylint
    "RUF", # ruff
    "UP",  # pyupgrade
]

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.isort]
length-sort = true
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Failed to get GPU count using pynvml:RuntimeWarning:pytest_isolate.plugin",
]
