version: 2
updates:
  # pyproject.toml dependencies and dependency groups. uv.lock is not committed
  # (this is a library), so this bumps the minimums and pins in pyproject.toml.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # Match the 2-day exclude-newer cooldown in [tool.uv].
    cooldown:
      default-days: 2
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    # Deliberate test-only caps in the testing group of pyproject.toml. Without
    # these, Dependabot raises the caps and the tests break. Remove each entry
    # together with its cap.
    ignore:
      # aiohttp<3.14: aioresponses can't mock aiohttp 3.14 responses
      # (pnuckowski/aioresponses#289).
      - dependency-name: aiohttp
        versions: [">=3.14"]
      # pytest<9.2: pytest-isolate 0.0.17 breaks on pytest 9.2. Drop the cap
      # and this entry once pytest-isolate 0.0.18 clears the 2-day cooldown.
      - dependency-name: pytest
        versions: [">=9.2"]

  # Actions are pinned to commit SHAs; Dependabot bumps the SHA and the
  # trailing "# vX.Y.Z" comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    groups:
      github-actions:
        patterns: ["*"]

  # Hook revs in .pre-commit-config.yaml. The ruff-pre-commit rev must match the
  # ruff pin in pyproject.toml's dev group, so merge both ruff bumps together.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 2
    groups:
      pre-commit:
        patterns: ["*"]
