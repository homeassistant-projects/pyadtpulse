name: Validate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # ruff-action installs the ruff version pinned in pyproject.toml's dev group.
      - name: Ruff Check
        uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format=github

      - name: Ruff Format
        uses: astral-sh/ruff-action@v3
        with:
          args: format --check --diff
