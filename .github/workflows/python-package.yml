# Run the test suite on every supported Python version.

name: Test with Supported Python Versions

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_call:

permissions:
  contents: read

# PRs: a new push cancels the older run. master: one group per commit, so
# back-to-back merges each get a full run (GitHub cancels a *pending* run
# whenever a newer one joins its group, even without cancel-in-progress).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync uv
        run: uv sync --no-dev

      - name: Test with pytest
        run: uv run --no-dev --frozen pytest --isolate
